apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: prepull-gameserver
  namespace: default
spec:
  selector:
    matchLabels:
      app: prepull-gameserver
  template:
    metadata:
      labels:
        app: prepull-gameserver
    spec:
      nodeSelector:
        gs-node: "true"
      tolerations:
        - effect: NoSchedule
          operator: Exists
      restartPolicy: Always
      containers:
        - name: prepull-sidecar
          imagePullPolicy: Always
          image: dota2classic/srcds-sidecar:k8s-latest
          command: ["sh", "-c", "echo Pulled sidecar image && sleep 30"]
        - name: prepull-gameserver
          imagePullPolicy: Always
          image: dota2classic/srcds:d684_dev-k8s-latest
          command: ["sh", "-c", "echo Pulled gameserver image && sleep 180"]
