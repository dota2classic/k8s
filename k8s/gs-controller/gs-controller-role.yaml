apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gs-controller-role
  namespace: default
rules:
  - apiGroups: [""]
    resources: ["configmaps", "pods", "secrets"]
    verbs: ["get", "list", "create", "delete", "update"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete", "update"]
