apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        prometheus-scrape: "true"
    spec:
      nodeSelector:
        ru.dotaclassic/nodeType: "infra"
      containers:
        - name: api
          image: dota2classic/gateway:k8s-latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 150m
              memory: 300Mi
            limits:
              cpu: 500m
              memory: 500Mi
          ports:
            - containerPort: 6001
              name: http-public-api
          readinessProbe:
            httpGet:
              path: /v1/match/all?page=0&per_page=1
              port: 6001
            initialDelaySeconds: 5
            periodSeconds: 5
          envFrom:
            - secretRef:
                name: shared-secrets
          env:
            - name: APP_NAME
              value: "gateway"
            - name: GAMESERVER_API
              value: "http://gameserver:5003"
            - name: TRADE_API
              value: "http://tradebot:6100"
            - name: FORUM_API
              value: "http://forum:6009"
            - name: TOURNAMENT_API
              value: "http://tournament:6600"
            - name: MATCHMAKER_API
              value: "http://matchmaker:7777"
            - name: FRONTEND_URL
              value: "https://${HOST}"
            - name: BASE_DOMAIN
              value: ${HOST}
            - name: BACKEND_URL
              value: "https://api.${HOST}"
            - name: NODE_ENV
              value: "production"
