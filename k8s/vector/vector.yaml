---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: kube-system
data:
  vector.toml: |
    [sources.kubernetes_logs]
    type = "kubernetes_logs"
    read_from = "beginning"
    auto_partial_merge = true


    [transforms.parse_json]
    type = "remap"
    inputs = ["kubernetes_logs"]
    source = '''
    # Try to parse message as JSON for structured logs
    if is_string(.message) {
      parsed, err = parse_json(.message)
      if err == null {
        . = merge(., parsed)
      }
    }
    '''

    [transforms.add_labels]
    type = "remap"
    inputs = ["parse_json"]
    source = '''
    .namespace = if exists(.kubernetes.pod_namespace) { .kubernetes.pod_namespace } else { "unknown" }
    .pod = if exists(.kubernetes.pod_name) { .kubernetes.pod_name } else { "unknown" }
    .container = if exists(.kubernetes.container_name) { .kubernetes.container_name } else { "unknown" }
    .app = if exists(.kubernetes.pod_labels.app) { .kubernetes.pod_labels.app } else { "unknown" }
    .node = if exists(.kubernetes.pod_node_name) { .kubernetes.pod_node_name } else { "unknown" }

    # Extract match_id from pod name pattern: gameserver-*-job-{match_id}-{hash}
    pod_name = string!(.pod)
    match_result = parse_regex(pod_name, r'gameserver-(?:cpu-affinity|regular)-job-(?P<match_id>\d+)-\w+')
    if match_result != null {
      .match_id = match_result.match_id
    }

    del(.kubernetes)
    del(.file)
    del(.source_type)
    '''

    [sinks.loki]
    type = "loki"
    inputs = ["add_labels"]
    endpoint = "http://141.105.71.200:3100"
    encoding.codec = "json"
    batch.max_events = 1000
    batch.timeout_secs = 5
    batch.max_bytes = 5000000

    [sinks.loki.request]
    rate_limit_num = 10
    rate_limit_duration_secs = 1
    retry_initial_backoff_secs = 2
    retry_max_duration_secs = 30
    
    labels.namespace = "{{ namespace }}"
    labels.pod = "{{ pod }}"
    labels.container = "{{ container }}"
    labels.app = "{{ app }}"
    labels.node = "{{ node }}"
    labels.match_id = "{{ match_id }}"
    labels.job = "vector"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      hostNetwork: false
      containers:
        - name: vector
          image: timberio/vector:latest-alpine
          args: ["--config", "/etc/vector/vector.toml"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibkubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: vector-config
              mountPath: /etc/vector
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibkubelet
          hostPath:
            path: /var/lib/kubelet
        - name: vector-config
          configMap:
            name: vector-config
