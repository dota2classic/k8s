---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vector
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: kube-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: kube-system
data:
  vector.toml: |
    [sources.kubernetes_logs]
    type = "kubernetes_logs"
    read_from = "beginning"       # <-- was start_of_file
    auto_partial_merge = true            # merge multi-line logs


    [transforms.add_labels]
    type = "remap" # adds labels like Promtail
    inputs = ["kubernetes_logs"]
    source = '''
    .namespace = .kubernetes.namespace_name
    .pod = .kubernetes.pod_name
    .container = .kubernetes.container_name
    '''

    [sinks.loki]
    type = "loki"
    inputs = ["add_labels"]
    endpoint = "http://141.105.71.200:3100/loki/api/v1/push"
    encoding.codec = "json"
    labels.namespace = "{{ namespace }}"
    labels.pod = "{{ pod }}"
    labels.container = "{{ container }}"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-agent
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      hostNetwork: false
      containers:
        - name: vector
          image: timberio/vector:latest-alpine
          args: ["--config", "/etc/vector/vector.toml"]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibkubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: vector-config
              mountPath: /etc/vector
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibkubelet
          hostPath:
            path: /var/lib/kubelet
        - name: vector-config
          configMap:
            name: vector-config
