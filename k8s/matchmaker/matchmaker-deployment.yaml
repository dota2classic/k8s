apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaker
  template:
    metadata:
      labels:
        app: matchmaker
        prometheus-scrape: "true"
    spec:
      nodeSelector:
        ru.dotaclassic/nodeType: "infra"
      containers:
        - name: matchmaker
          image: dota2classic/matchmaker:k8s-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 7777
              name: http-public-api

          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 128Mi

          envFrom:
            - secretRef:
                name: shared-secrets
          env:
            - name: APP_NAME
              value: "matchmaker"
            - name: NODE_ENV
              value: "production"
            - name: GAMESERVER_API
              value: "http://gameserver:5003"
