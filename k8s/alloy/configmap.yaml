apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
data:
  config.alloy: |
    faro.receiver "frontend" {
      server {
        listen_address       = "0.0.0.0"
        listen_port          = 12347
        cors_allowed_origins = ["https://${HOST}", "https://en.${HOST}"]
      }
      output {
        logs = [loki.write.default.receiver]
      }
    }

    loki.write "default" {
      endpoint {
        url = "http://141.105.71.200:3100/loki/api/v1/push"
      }
      external_labels = {
        source = "faro",
        env    = "prod",
      }
    }
