apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gameserver
  template:
    metadata:
      labels:
        app: gameserver
        prometheus-scrape: "true"
    spec:
      nodeSelector:
        ru.dotaclassic/nodeType: "infra"
      containers:
        - name: gameserver
          image: dota2classic/gameserver:k8s-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
              name: http-public

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          envFrom:
            - secretRef:
                name: shared-secrets
          env:
            - name: APP_NAME
              value: "gameserver"
            - name: FORUM_API
              value: "http://forum:6009"
            - name: NODE_ENV
              value: "production"
