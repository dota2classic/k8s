apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-backup-scripts
  namespace: default
data:
  backup-s3.js: |
    'use strict';
    const fs=require('node:fs'),fsp=fs.promises,https=require('node:https'),crypto=require('node:crypto');
    const {pipeline}=require('node:stream/promises');
    const bucket=process.env.S3_BUCKET,access=process.env.S3_ACCESS_KEY_ID,secret=process.env.S3_SECRET_ACCESS_KEY;
    const region=process.env.S3_REGION||'us-east-1',master=Buffer.from(process.env.BACKUP_ENCRYPTION_KEY||'','hex');
    if(bucket!=='d2c-production-backups'||!access||!secret||master.length!==32)throw Error('Invalid backup configuration');
    const sha=data=>crypto.createHash('sha256').update(data).digest('hex');
    const mac=(key,data)=>crypto.createHmac('sha256',key).update(data).digest();
    async function digest(file){const h=crypto.createHash('sha256');for await(const block of fs.createReadStream(file))h.update(block);return h.digest('hex');}
    function signed(method,key,hash,extra={}){
      if(key.startsWith('/')||key.split('/').includes('..'))throw Error('Unsafe object key');
      const uri='/'+[bucket,...key.split('/')].map(x=>encodeURIComponent(x).replace(/[!'()*]/g,c=>'%'+c.charCodeAt(0).toString(16).toUpperCase())).join('/');
      const date=new Date().toISOString().replace(/[:-]|\.\d{3}/g,''),day=date.slice(0,8);
      const headers={host:'cdn.dotaclassic.ru','x-amz-content-sha256':hash,'x-amz-date':date,...extra};
      const names=Object.keys(headers).sort(),signedHeaders=names.join(';');
      const canonical=[method,uri,'',names.map(n=>n+':'+String(headers[n]).trim()+'\n').join(''),signedHeaders,hash].join('\n');
      const scope=day+'/'+region+'/s3/aws4_request';
      const signing=mac(mac(mac(mac('AWS4'+secret,day),region),'s3'),'aws4_request');
      const signature=mac(signing,'AWS4-HMAC-SHA256\n'+date+'\n'+scope+'\n'+sha(canonical)).toString('hex');
      headers.authorization='AWS4-HMAC-SHA256 Credential='+access+'/'+scope+', SignedHeaders='+signedHeaders+', Signature='+signature;
      return {hostname:'141.105.71.200',servername:'cdn.dotaclassic.ru',port:443,method,path:uri,headers};
    }
    async function request(method,key,{file,body,destination}={}){
      const payload=file?await digest(file):sha(body||'');
      const options=signed(method,key,payload);
      if(file||body!==undefined)options.headers['content-length']=file?(await fsp.stat(file)).size:Buffer.byteLength(body);
      for(let attempt=1;attempt<=3;attempt++){
        try{return await new Promise((resolve,reject)=>{
          const req=https.request(options,async res=>{
            try{
              if(res.statusCode<200||res.statusCode>=300){res.resume();throw Error('S3 '+method+' failed with HTTP '+res.statusCode);}
              if(destination){await pipeline(res,fs.createWriteStream(destination,{mode:0o600}));resolve();}
              else{const chunks=[];for await(const chunk of res){chunks.push(chunk);if(chunks.reduce((n,c)=>n+c.length,0)>1024*1024)throw Error('Unexpected response size');}resolve(Buffer.concat(chunks));}
            }catch(error){res.destroy();reject(error);}
          });
          req.setTimeout(30000,()=>req.destroy(Error('S3 inactivity timeout')));req.on('error',reject);
          if(file){const source=fs.createReadStream(file);source.on('error',error=>req.destroy(error));req.on('error',()=>source.destroy());source.pipe(req);}else req.end(body);
        });}catch(error){if(attempt===3)throw error;await new Promise(r=>setTimeout(r,attempt*2000));}
      }
    }
    async function encrypt(input,output){
      const iv=crypto.randomBytes(12),cipher=crypto.createCipheriv('aes-256-gcm',master,iv);
      await fsp.writeFile(output,Buffer.concat([Buffer.from('D2CBK01\n'),iv]),{mode:0o600});
      await pipeline(fs.createReadStream(input),cipher,fs.createWriteStream(output,{flags:'a'}));
      await fsp.appendFile(output,cipher.getAuthTag());
    }
    async function decrypt(input,output){
      const file=await fsp.open(input,'r'),size=(await file.stat()).size;
      try{
        const header=Buffer.alloc(20),tag=Buffer.alloc(16);
        await file.read(header,0,20,0);await file.read(tag,0,16,size-16);
        if(header.subarray(0,8).toString()!=='D2CBK01\n'||size<36)throw Error('Invalid encrypted backup');
        const cipher=crypto.createDecipheriv('aes-256-gcm',master,header.subarray(8));cipher.setAuthTag(tag);
        await pipeline(fs.createReadStream(input,{start:20,end:size-17}),cipher,fs.createWriteStream(output,{mode:0o600}));
      }finally{await file.close();}
    }
    async function main(){
      if(process.argv[2]==='upload'){
        const plain='/backup/postgres.dump',sealed=plain+'.enc';await encrypt(plain,sealed);
        const stamp=new Date().toISOString().replace(/[:.]/g,'-'),key='postgres/'+stamp+'.dump.enc';
        const report={format:'D2CBK01/AES-256-GCM',objectKey:key,plaintextBytes:(await fsp.stat(plain)).size,encryptedBytes:(await fsp.stat(sealed)).size,plaintextSha256:await digest(plain),encryptedSha256:await digest(sealed),createdAt:new Date().toISOString()};
        await request('PUT',key,{file:sealed});
        const metadata=JSON.stringify(report);
        await request('PUT',key+'.json',{body:metadata});await request('PUT','postgres/latest.json',{body:metadata});
        console.log(JSON.stringify({...report,bucket,uploadSuccess:true}));
      }else if(process.argv[2]==='download-latest'){
        const report=JSON.parse((await request('GET','postgres/latest.json')).toString());
        if(!/^postgres\/[a-zA-Z0-9T-]+Z\.dump\.enc$/.test(report.objectKey))throw Error('Invalid backup object key');
        const sealed='/backup/postgres.dump.enc',plain='/backup/postgres.dump';
        await request('GET',report.objectKey,{destination:sealed});
        if(await digest(sealed)!==report.encryptedSha256)throw Error('Encrypted backup checksum mismatch');
        await decrypt(sealed,plain);
        if(await digest(plain)!==report.plaintextSha256)throw Error('Decrypted backup checksum mismatch');
        await fsp.writeFile('/backup/verification.json',JSON.stringify(report),{mode:0o600});
        console.log(JSON.stringify({downloaded:report.objectKey,decryptionAndHashesVerified:true}));
      }else throw Error('Expected upload or download-latest');
    }
    main().catch(error=>{console.error('Backup failed:',error.message);process.exitCode=1;});
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: default
spec:
  schedule: '15 */6 * * *'
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1200
      template:
        metadata:
          labels: {app: postgres-backup}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          nodeSelector:
            ru.dotaclassic/infra: 'true'
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile: {type: RuntimeDefault}
          initContainers:
          - name: dump
            image: postgres@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
            command: [sh, '-ec']
            args:
            - pg_dump --format=custom --compress=6 --no-owner --no-acl --lock-wait-timeout=10s --file=/backup/postgres.dump; pg_restore --list /backup/postgres.dump > /backup/archive-toc.txt
            env:
            - {name: PGHOST, value: postgres.default.svc.cluster.local}
            - {name: PGPORT, value: '5432'}
            - {name: PGUSER, value: postgres}
            - {name: PGDATABASE, value: postgres}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: shared-secrets, key: POSTGRES_PASSWORD}
            resources:
              requests: {cpu: 50m, memory: 64Mi}
              limits: {cpu: 500m, memory: 256Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            volumeMounts:
            - {name: backup, mountPath: /backup}
          containers:
          - name: upload
            image: node@sha256:12f54cafa58d0e96554ae05871e29663ff7241836377dc9a7916449b8adb062c
            command: [node, /scripts/backup-s3.js, upload]
            envFrom:
            - secretRef: {name: postgres-backup-secrets}
            resources:
              requests: {cpu: 25m, memory: 64Mi}
              limits: {cpu: 500m, memory: 192Mi}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: [ALL]}
            volumeMounts:
            - {name: backup, mountPath: /backup}
            - {name: scripts, mountPath: /scripts, readOnly: true}
          volumes:
          - name: backup
            emptyDir: {sizeLimit: 2Gi}
          - name: scripts
            configMap: {name: postgres-backup-scripts}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-backup
  namespace: default
spec:
  podSelector:
    matchLabels: {app: postgres-backup}
  policyTypes: [Ingress, Egress]
  egress:
  - to:
    - podSelector:
        matchLabels: {app: postgres}
    ports: [{protocol: TCP, port: 5432}]
  - to:
    - namespaceSelector:
        matchLabels: {kubernetes.io/metadata.name: kube-system}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:
    - ipBlock: {cidr: 141.105.71.200/32}
    ports: [{protocol: TCP, port: 443}]
