apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
  - hosts: [dotaclassic.ru, www.dotaclassic.ru, en.dotaclassic.ru]
    secretName: frontend-tls
  rules:
  - host: dotaclassic.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: {number: 3000}
  - host: www.dotaclassic.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: {number: 3000}
  - host: en.dotaclassic.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: {number: 3000}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: frontend-https
  namespace: default
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-http
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: default-frontend-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
  - host: dotaclassic.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: {number: 3000}
  - host: www.dotaclassic.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: {number: 3000}
  - host: en.dotaclassic.ru
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port: {number: 3000}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crawler-ratelimit
  namespace: default
spec:
  rateLimit:
    average: 10
    period: 1m
    burst: 5
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: frontend-crawlers
  namespace: default
spec:
  entryPoints: [websecure]
  routes:
  - match: (Host(`dotaclassic.ru`) || Host(`www.dotaclassic.ru`) || Host(`en.dotaclassic.ru`)) && HeaderRegexp(`User-Agent`, `(?i)(GPTBot|OAI-SearchBot|ClaudeBot|CCBot|Bytespider|Amazonbot|meta-externalagent|AhrefsBot|SemrushBot|MJ12bot|PetalBot|DotBot|DataForSeoBot)`)
    kind: Rule
    middlewares:
    - name: crawler-ratelimit
    services:
    - name: frontend
      port: 3000
  tls:
    secretName: frontend-tls
