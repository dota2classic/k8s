apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: default
spec:
  selector:
    app: postgres
  ports:
  - name: main
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: default
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        ru.dotaclassic/infra: 'true'
      containers:
      - name: postgres
        image: postgres:16.4-bookworm
        envFrom:
        - secretRef:
            name: shared-secrets
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        args:
        - if [ -d /var/lib/postgresql/data/pgdata ]; then chmod 700 /var/lib/postgresql/data/pgdata;
          fi; exec docker-entrypoint.sh postgres -c shared_buffers=256MB -c max_connections=150
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1500m
            memory: 2Gi
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          periodSeconds: 10
        startupProbe:
          exec:
            command:
            - pg_isready
            - -U
            - postgres
          periodSeconds: 5
          failureThreshold: 60
        command:
        - sh
        - -ec
      securityContext:
        runAsUser: 999
        runAsGroup: 999
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 20Gi
  updateStrategy:
    type: OnDelete
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: default
spec:
  selector:
    app: redis
  ports:
  - name: main
    port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: default
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        ru.dotaclassic/infra: 'true'
      containers:
      - name: redis
        image: redis:7.4.0-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: shared-secrets
              key: REDIS_PASSWORD
        command:
        - sh
        - -ec
        args:
        - exec redis-server --requirepass "$REDIS_PASSWORD" --dir /data --appendonly
          yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 256Mi
        readinessProbe:
          exec:
            command: &id001
            - sh
            - -ec
            - REDISCLI_AUTH="$REDIS_PASSWORD" redis-cli ping | grep -q PONG
          periodSeconds: 10
        startupProbe:
          exec:
            command: *id001
          periodSeconds: 5
          failureThreshold: 30
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 1Gi
  updateStrategy:
    type: OnDelete
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: default
spec:
  selector:
    app: rabbitmq
  ports:
  - name: main
    port: 5672
    targetPort: 5672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: default
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      terminationGracePeriodSeconds: 60
      nodeSelector:
        ru.dotaclassic/infra: 'true'
      containers:
      - name: rabbitmq
        image: rabbitmq:3.13-management
        envFrom:
        - secretRef:
            name: shared-secrets
        env:
        - name: RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS
          value: +S 2:2
        volumeMounts:
        - name: data
          mountPath: /var/lib/rabbitmq
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - check_running
          periodSeconds: 15
          timeoutSeconds: 10
        startupProbe:
          exec:
            command:
            - rabbitmq-diagnostics
            - -q
            - ping
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 30
        command:
        - sh
        - -ec
        args:
        - if [ -f /var/lib/rabbitmq/.erlang.cookie ]; then chmod 600 /var/lib/rabbitmq/.erlang.cookie;
          fi; exec docker-entrypoint.sh rabbitmq-server
      securityContext:
        runAsUser: 999
        runAsGroup: 999
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: local-path
      resources:
        requests:
          storage: 2Gi
  updateStrategy:
    type: OnDelete
