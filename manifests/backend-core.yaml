apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-stage-egress
  namespace: default
spec:
  podSelector:
    matchLabels:
      stage: backend
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
---
apiVersion: v1
kind: Service
metadata:
  name: gameserver
  namespace: default
spec:
  selector:
    app: gameserver
  ports:
  - port: 5003
    targetPort: 5003
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameserver
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameserver
  template:
    metadata:
      labels:
        app: gameserver
        stage: backend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        ru.dotaclassic/infra: 'true'
      containers:
      - name: gameserver
        image: dota2classic/gameserver@sha256:96ad4646eaffa66e79be40dee4c4382f9343334ccfa0ce06130c548371130b1d
        envFrom:
        - secretRef:
            name: shared-secrets
        env:
        - name: APP_NAME
          value: gameserver
        - name: NODE_ENV
          value: production
        - name: FLUENTBIT_DISABLED
          value: 'true'
        - name: GAMESERVER_API
          value: http://gameserver:5003
        - name: FORUM_API
          value: http://forum:6009
        - name: SCALET
          value: 'true'
        resources:
          requests:
            cpu: 60m
            memory: 128Mi
          limits:
            memory: 384Mi
        ports:
        - containerPort: 5003
        readinessProbe:
          httpGet:
            path: /info/seasons
            port: 5003
          periodSeconds: 10
          timeoutSeconds: 10
        startupProbe:
          tcpSocket:
            port: 5003
          periodSeconds: 5
          failureThreshold: 60
---
