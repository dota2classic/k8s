apiVersion: v1
kind: Service
metadata:
  name: forum
spec:
  selector:
    app: forum
  ports:
  - port: 6009
    targetPort: 6009
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forum
  template:
    metadata:
      labels:
        app: forum
        stage: backend
    spec:
      nodeSelector:
        ru.dotaclassic/infra: 'true'
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: forum
        image: dota2classic/forum@sha256:7dcf346ca31a1c4f079b7852578319487495750828a2f29a8cf9ea860cb763f5
        envFrom:
        - secretRef:
            name: shared-secrets
        env:
        - name: APP_NAME
          value: forum
        - name: NODE_ENV
          value: production
        resources:
          requests:
            cpu: 30m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        ports:
        - containerPort: 6009
        startupProbe:
          tcpSocket:
            port: 6009
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 6009
          periodSeconds: 10
