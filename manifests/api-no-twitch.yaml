apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: default
spec:
  selector:
    app: api
  ports:
  - port: 6001
    targetPort: 6001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        stage: backend
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
      - name: api
        image: dota2classic/gateway@sha256:4960718452cc14df7de9a562fc4ab4cc32ef8c9c1ae8b95f6ad87e5e2bf75f0b
        envFrom:
        - secretRef:
            name: shared-secrets
        env:
        - name: APP_NAME
          value: api
        - name: NODE_ENV
          value: production
        - name: GAMESERVER_API
          value: http://gameserver:5003
        - name: MATCHMAKER_API
          value: http://matchmaker:7777
        - name: FORUM_API
          value: http://forum:6009
        - name: TOURNAMENT_API
          value: http://tournament:6007
        - name: TRADE_API
          value: http://tradebot:6100
        - name: PROMETHEUS_URL
          value: http://141.105.71.200:9090
        - name: FRONTEND_URL
          value: https://dotaclassic.ru
        - name: BACKEND_URL
          value: https://api.dotaclassic.ru
        - name: BASE_DOMAIN
          value: dotaclassic.ru
        - name: TWITCH_ENABLED
          value: 'false'
        resources:
          requests:
            cpu: 550m
            memory: 256Mi
          limits:
            memory: 512Mi
        ports:
        - containerPort: 6001
        startupProbe:
          tcpSocket:
            port: 6001
          periodSeconds: 5
          failureThreshold: 60
        readinessProbe:
          tcpSocket:
            port: 6001
          periodSeconds: 10
